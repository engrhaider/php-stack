services:
  webserver:
    image: caddy:2-alpine
    container_name: "${COMPOSE_PROJECT_NAME}-webserver"
    restart: unless-stopped
    depends_on:
      - php-fpm
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT:-80}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT:-443}:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/certs:/certs:ro
      - ${DOCUMENT_ROOT:-./projects}:/var/www:rw
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile-php-fpm
      args:
        PHP_VERSION: ${PHPVERSION:-8.4}
    # Tag the built image with the PHP version so switching PHPVERSION keeps each
    # version as its own image (e.g. ...-php-fpm:8.1 and ...-php-fpm:8.4 coexist).
    image: "${COMPOSE_PROJECT_NAME:-php-stack}-php-fpm:${PHPVERSION:-8.4}"
    container_name: "${COMPOSE_PROJECT_NAME}-php-fpm-${PHPVERSION}"
    restart: unless-stopped
    depends_on:
      - database
    volumes:
      - ${DOCUMENT_ROOT:-./projects}:/var/www:rw
      - ${PHP_INI:-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ./logs/xdebug:/var/log/xdebug
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=${XDEBUG_PORT:-9003}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  database:
    image: mysql:8
    container_name: "${COMPOSE_PROJECT_NAME}-database"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_INITDB_DIR:-./config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR:-./logs/mysql}:/var/log/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"

  phpmyadmin:
    image: phpmyadmin
    container_name: "${COMPOSE_PROJECT_NAME}-phpmyadmin"
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "${HOST_MACHINE_PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: ${MEMORY_LIMIT}

  redis:
    image: redis:latest
    container_name: "${COMPOSE_PROJECT_NAME}-redis"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_MACHINE_REDIS_PORT:-6379}:6379"

volumes:
  caddy_data:
  caddy_config: